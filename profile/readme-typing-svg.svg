<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 435 50'
    style='background-color: #00000000;'
    width='435px'
    height='50px'>

    <style>
@font-face {
  font-family: 'ZCOOL KuaiLe';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

    <path id='path0'>
        <!-- Single line -->
        <animate
            id='d0'
            attributeName='d'
            begin='0s'
            dur='4000ms'
            fill='remove'
            values='m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h0'
            keyTimes='0;0.6;0.85;1' />
    </path>
    <text
        font-family='"ZCOOL KuaiLe", monospace'
        fill='#7385C9'
        font-size='20'
        dominant-baseline='auto'
        x='0%'
        text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            我是InfinityYeah
        </textPath>
    </text>
    <path id='path1'>
        <!-- Single line -->
        <animate
            id='d1'
            attributeName='d'
            begin='d0.end'
            dur='4000ms'
            fill='freeze'
            values='m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h435'
            keyTimes='0;0.6;0.85;1' />
    </path>
    <text
        font-family='"ZCOOL KuaiLe", monospace'
        fill='#7385C9'
        font-size='20'
        dominant-baseline='auto'
        x='0%'
        text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            欢迎来到我的小网站
        </textPath>
    </text>
</svg>
