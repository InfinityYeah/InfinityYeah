<svg xmlns="http://www.w3.org/2000/svg"
    width="42"
    height="20"
    role="img"
    aria-label="♀: 15">
    <title>♀: 15</title>
    <filter id="blur">
        <feGaussianBlur stdDeviation="16" />
    </filter>
    <linearGradient
        id="s"
        x2="0"
        y2="100%">
        <stop
            offset="0"
            stop-color="#bbb"
            stop-opacity=".1" />
        <stop
            offset="1"
            stop-opacity=".1" />
    </linearGradient>
    <clipPath id="r">
        <rect
            width="42"
            height="20"
            rx="3" />
    </clipPath>
    <g clip-path="url(#r)">
        <rect
            width="19"
            height="20"
            fill="#F5FFFA" />
        <rect
            x="19"
            width="23"
            height="20"
            fill="#F8F8FF" />
        <rect
            width="42"
            height="20"
            fill="url(#s)" />
    </g>
    <g
        fill="#FF69B4"
        text-anchor="middle"
        font-family="Verdana,Geneva,DejaVu Sans,sans-serif"
        text-rendering="geometricPrecision"
        font-size="110">
        <g transform="scale(.1)">
            <text
                x="105"
                y="140"
                textLength="90">♀</text>
        </g>
        <g transform="scale(.1)">
            <text
                x="295"
                y="140"
                textLength="130"
                fill="#333">15</text>
        </g>
    </g>
</svg>